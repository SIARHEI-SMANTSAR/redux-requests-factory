name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - run: node -e "require('redux-requests-factory')"
      - run: node --input-type=module -e "await import('redux-requests-factory')"
      - run: npm pack --dry-run
      - name: Check packed types with Redux 4 and 5
        run: |
          package_dir="$(mktemp -d "$RUNNER_TEMP/requests-factory-package.XXXXXXXX")"
          npm pack --pack-destination "$package_dir"
          archives=("$package_dir"/*.tgz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "$archive"
          for redux_version in 4 5; do
            consumer="$(mktemp -d "$RUNNER_TEMP/requests-factory.XXXXXXXX")"
            (
              cd "$consumer"
              npm init -y >/dev/null
              npm install --ignore-scripts "$archive" "redux@$redux_version"
              cat > consumer.mts <<'EOF'
          import { applyMiddleware, combineReducers, createStore } from 'redux';
          import createFactory, {
            requestsFactory,
            type RequestsFactoryDispatch,
          } from 'redux-requests-factory';

          requestsFactory({ stateRequestKey: 'default', request: async () => 1 });
          const factory = createFactory({ stateRequestsKey: 'api' });
          const request = factory.requestsFactory({
            stateRequestKey: 'custom',
            request: async () => 1,
          });
          const { middleware } = factory.createRequestsFactoryMiddleware();
          const store = createStore(
            combineReducers({ api: factory.requestsReducer }),
            applyMiddleware(middleware)
          );
          const dispatch = store.dispatch as RequestsFactoryDispatch & typeof store.dispatch;
          const pending: Promise<void> = dispatch(request.loadDataAction());
          EOF
              cp consumer.mts consumer.cts
              "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --module NodeNext consumer.mts consumer.cts
            )
          done

  e2e-react-streaming-ssr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react/ssr-render-to-pipeable-stream-use/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/react/ssr-render-to-pipeable-stream-use
      - run: npx playwright install --with-deps chromium
        working-directory: examples/react/ssr-render-to-pipeable-stream-use
      - run: npm run build
        working-directory: examples/react/ssr-render-to-pipeable-stream-use
      - run: npm run test:e2e
        working-directory: examples/react/ssr-render-to-pipeable-stream-use

  e2e-next-server-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/next-js/redux-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/next-js/redux-app
      - run: npx playwright install --with-deps chromium
        working-directory: examples/next-js/redux-app
      - run: npm run test:e2e
        working-directory: examples/next-js/redux-app
